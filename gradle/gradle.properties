# Включение постоянного демона и параллельной сборки модулей
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Выделение памяти для JVM (позволяет избежать OutOfMemory при тяжелых сборках)
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Использование Kotlin Build Reports для отладки времени компиляции
kotlin.build.report.output=file